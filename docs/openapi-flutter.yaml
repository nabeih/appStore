        409:
          description: 'Cursor scope changed or upload UUID conflict.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        422:
          description: 'Invalid envelope, fields or cursor.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        429:
          description: 'Rate limit. Respect Retry-After.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            Retry-After:
              schema:
                type: string
              description: 'Seconds to wait'
        503:
          description: 'Schema/tracking unavailable or temporary failure. Never discard outbox.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /sync/push:
    post:
      operationId: mobilePush
      summary: 'Topologically ordered batch; atomic per operation, not per batch.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Push'
      responses:
        200:
          description: 'Match by operation_uuid. HTTP200 does not mean every operation accepted.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PushResult'
        401:
          description: 'Token missing, expired, revoked or account unavailable.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        403:
          description: 'Permission or branch denied.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        404:
          description: 'Record unavailable in this scope.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        409:
          description: 'Cursor scope changed or upload UUID conflict.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        422:
          description: 'Invalid envelope, fields or cursor.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        429:
          description: 'Rate limit. Respect Retry-After.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            Retry-After:
              schema:
                type: string
              description: 'Seconds to wait'
        503:
          description: 'Schema/tracking unavailable or temporary failure. Never discard outbox.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  '/sync/operations/{operation}':
    get:
      operationId: mobileOperationStatus
      summary: 'Resolve a lost network response without creating another operation.'
      parameters:
        -
          name: operation
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        200:
          description: 'Persisted operation receipt.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  operation_uuid:
                    type: string
                    format: uuid
                  status:
                    type: string
                    enum:
                      - accepted
                      - retryable
                      - conflict_requires_review
                      - validation_failed
                      - dependency_blocked
                  result:
                    type: object
                required:
                  - operation_uuid
                  - status
                  - result
        401:
          description: 'Token missing, expired, revoked or account unavailable.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        403:
          description: 'Permission or branch denied.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        404:
          description: 'Record unavailable in this scope.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        409:
          description: 'Cursor scope changed or upload UUID conflict.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        422:
          description: 'Invalid envelope, fields or cursor.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        429:
          description: 'Rate limit. Respect Retry-After.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            Retry-After:
              schema:
                type: string
              description: 'Seconds to wait'
        503:
          description: 'Schema/tracking unavailable or temporary failure. Never discard outbox.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /product-images:
    post:
      operationId: mobileUploadProductImage
      summary: 'Upload one product-color image; two WebP derivatives only. No implicit replacement.'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                operation_uuid:
                  type: string
                  format: uuid
                schema_version:
                  type: integer
                  const: 1
                branch_id:
                  type: integer
                  format: int64
                  minimum: 1
                product_id:
                  type: integer
                  format: int64
                  minimum: 1
                color_id:
                  type: integer
                  format: int64
                  minimum: 1
                image:
                  type: string
                  format: binary
                  description: 'JPEG/PNG/WebP, max4MiB, dimensions max6000; processor enforces pixel budget.'
              required:
                - operation_uuid
                - schema_version
                - branch_id
                - product_id
                - color_id
                - image
              additionalProperties: false
      responses:
        200:
          description: 'Image receipt; retry same accepted bytes/UUID without duplicate files.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                      - accepted
                      - already_applied
                  result:
                    $ref: '#/components/schemas/ImageReceipt'
                required:
                  - status
                  - result
        401:
          description: 'Token missing, expired, revoked or account unavailable.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        403:
          description: 'Permission or branch denied.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        404:
          description: 'Record unavailable in this scope.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        409:
          description: 'Cursor scope changed or upload UUID conflict.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        422:
          description: 'Invalid envelope, fields or cursor.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        429:
          description: 'Rate limit. Respect Retry-After.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            Retry-After:
              schema:
                type: string
              description: 'Seconds to wait'
        503:
          description: 'Schema/tracking unavailable or temporary failure. Never discard outbox.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: 'Sanctum personal access token'
  schemas:
    Error:
      type: object
      properties:
        message:
          type: string
      required:
        - message
    ValidationError:
      type: object
      properties:
        message:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
      required:
        - message
        - errors
    Branch:
      type: object
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        name:
          type: string
        is_active:
          type: boolean
      required:
        - id
        - name
        - is_active
    User:
      type: object
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        name:
          type: string
        username:
          type: string
        role:
          type: string
        permissions:
          type: array
          items:
            type: string
        branches:
          type: array
          items:
            $ref: '#/components/schemas/Branch'
        schema_version:
          const: 1
      required:
        - id
        - name
        - username
        - role
        - permissions
        - branches
        - schema_version
    Login:
      type: object
      properties:
        username:
          type: string
          maxLength: 50
        password:
          type: string
          format: password
          maxLength: 72
          writeOnly: true
        device_id:
          type: string
          format: uuid
        device_name:
          type: string
          maxLength: 80
      required:
        - username
        - password
        - device_id
        - device_name
      additionalProperties: false
    LoginResult:
      type: object
      properties:
        token:
          type: string
          description: 'Bearer secret. Never log; put in platform secure storage.'
        expires_at:
          type: string
          format: date-time
