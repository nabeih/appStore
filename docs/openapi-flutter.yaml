              schema:
                $ref: '#/components/schemas/Error'
  '/data/{entity}/{id}':
    get:
      operationId: mobileDataShow
      summary: 'Direct ID lookup uses identical permissions and branch scope.'
      parameters:
        -
          name: entity
          in: path
          required: true
          schema:
            type: string
            enum:
              - branches
              - categories
              - colors
              - sizes
              - products
              - variants
              - images
              - swatches
              - stocks
              - customers
              - customer_balances
              - sales
              - receipts
              - accounts
              - suppliers
              - purchases
              - openings
        -
          name: branch_id
          in: query
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
        -
          name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        200:
          description: 'One allowed DTO.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/MobileRecord'
                required:
                  - data
        401:
          description: 'Token missing, expired, revoked or account unavailable.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        403:
          description: 'Permission or branch denied.'
          content:
