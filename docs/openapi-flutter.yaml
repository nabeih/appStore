        422:
          description: 'Invalid envelope, fields or cursor.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        429:
          description: 'Rate limit. Respect Retry-After.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            Retry-After:
