  /sync/pull:
    post:
      operationId: mobilePull
      summary: 'Resume a page or fetch incremental changes; no updated_at cutoff.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Pull'
      responses:
        200:
          description: 'Latest-state upserts and scoped tombstones. Persist cursor with page atomically.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncResult'
        401:
          description: 'Token missing, expired, revoked or account unavailable.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        403:
          description: 'Permission or branch denied.'
          content:
            application/json:
              schema:
