  '/devices/{device}':
    delete:
      operationId: mobileRevokeDevice
      summary: 'Permanently revoke one owned device.'
      parameters:
        -
          name: device
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        200:
          description: 'Device revoked.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        401:
          description: 'Token missing, expired, revoked or account unavailable.'
          content:
            application/json:
