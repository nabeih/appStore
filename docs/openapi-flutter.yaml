        429:
          description: 'Rate limit. Respect Retry-After.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            Retry-After:
              schema:
                type: string
              description: 'Seconds to wait'
        503:
          description: 'Schema/tracking unavailable or temporary failure. Never discard outbox.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /auth/logout:
    post:
      operationId: mobileLogout
      summary: 'Revoke this token; retain device identity and receipts.'
      responses:
        200:
          description: 'Logged out.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        401:
