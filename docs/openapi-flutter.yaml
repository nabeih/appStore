        429:
          description: 'Rate limit. Respect Retry-After.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            Retry-After:
              schema:
                type: string
              description: 'Seconds to wait'
        503:
          description: 'Schema/tracking unavailable or temporary failure. Never discard outbox.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  '/data/{entity}':
    get:
      operationId: mobileDataList
      summary: 'Allowlisted branch-scoped data; keyset pagination; not a sync cursor.'
      parameters:
        -
          name: entity
          in: path
          required: true
          schema:
            type: string
            enum:
              - branches
              - categories
              - colors
              - sizes
              - products
              - variants
              - images
              - swatches
              - stocks
              - customers
              - customer_balances
              - sales
              - receipts
              - accounts
              - suppliers
              - purchases
              - openings
        -
          name: branch_id
          in: query
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
        -
          name: q
          in: query
          required: false
          schema:
            type: string
            maxLength: 100
        -
          name: match
          in: query
          required: false
          schema:
            type: string
            enum:
              - contains
              - exact
              - prefix
        -
          name: after_id
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
        -
          name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        200:
          description: 'Scoped records. Supported q entities: products, variants, customers, suppliers, sales.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  schema_version:
                    const: 1
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/MobileRecord'
                  next_after_id:
                    type:
                      - integer
                      - 'null'
                    format: int64
                  server_timestamp:
                    type: string
                    format: date-time
                required:
                  - schema_version
                  - data
                  - next_after_id
                  - server_timestamp
        401:
          description: 'Token missing, expired, revoked or account unavailable.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        403:
          description: 'Permission or branch denied.'
          content:
            application/json:
              schema:
