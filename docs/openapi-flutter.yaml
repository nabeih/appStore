openapi: 3.1.0
info:
  title: 'appStore Flutter API'
  version: 1.0.0
  description: 'Backend implemented locally. Do not enable on app_store until migrations are approved. Full protocol and permission matrix: flutter-api-contract.md. Existing web search findings are separate; use only /api/v1 for this client.'
servers:
  -
    url: 'http://127.0.0.1:8000/api/v1'
    description: 'Local example; no customer database prepared automatically.'
  -
    url: 'https://api.your-store.example/api/v1'
    description: 'Deployment placeholder; no deployment performed.'
security:
  -
    bearerAuth: []
paths:
  /auth/login:
    post:
      operationId: mobileLogin
      summary: 'Password login and device registration; rotates token for existing device.'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
      responses:
        200:
          description: 'Token issued.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResult'
        401:
          description: 'Token missing, expired, revoked or account unavailable.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        403:
          description: 'Permission or branch denied.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        404:
          description: 'Record unavailable in this scope.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        409:
          description: 'Cursor scope changed or upload UUID conflict.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        422:
          description: 'Invalid envelope, fields or cursor.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        429:
          description: 'Rate limit. Respect Retry-After.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            Retry-After:
              schema:
                type: string
              description: 'Seconds to wait'
        503:
          description: 'Schema/tracking unavailable or temporary failure. Never discard outbox.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /auth/me:
    get:
      operationId: mobileMe
      summary: 'Live permissions and allowed branches.'
      responses:
        200:
          description: 'Authenticated user.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/User'
                required:
                  - data
        401:
          description: 'Token missing, expired, revoked or account unavailable.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        403:
          description: 'Permission or branch denied.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        404:
          description: 'Record unavailable in this scope.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        409:
          description: 'Cursor scope changed or upload UUID conflict.'
          content:
            application/json:
