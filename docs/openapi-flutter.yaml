  /sync/bootstrap:
    post:
      operationId: mobileBootstrap
      summary: 'Start/retry a device-bound initial sync with stable opaque cursor.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Bootstrap'
      responses:
        200:
          description: 'First page; continue with /sync/pull while has_more.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncResult'
        401:
          description: 'Token missing, expired, revoked or account unavailable.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        403:
          description: 'Permission or branch denied.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        404:
          description: 'Record unavailable in this scope.'
          content:
            application/json:
              schema:
